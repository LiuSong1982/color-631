<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="280" fill="#FAFBFC"/>
  <text x="60" y="36" font-size="18" font-weight="600" fill="#1A202C">图 1 · 6:3:1 默认配比（总量 100）</text>

  <text x="240" y="72" text-anchor="middle" font-size="14" fill="#2D3748">主色 60%（6 格）</text>
  <text x="510" y="72" text-anchor="middle" font-size="14" fill="#2D3748">辅色 30%（3 格）</text>
  <text x="630" y="72" text-anchor="middle" font-size="13" fill="#C53030">强调 10%</text>

  <rect x="60"  y="90" width="60" height="80" fill="#2D3748"/>
  <rect x="120" y="90" width="60" height="80" fill="#2D3748"/>
  <rect x="180" y="90" width="60" height="80" fill="#2D3748"/>
  <rect x="240" y="90" width="60" height="80" fill="#2D3748"/>
  <rect x="300" y="90" width="60" height="80" fill="#2D3748"/>
  <rect x="360" y="90" width="60" height="80" fill="#2D3748"/>
  <rect x="420" y="90" width="60" height="80" fill="#A0AEC0"/>
  <rect x="480" y="90" width="60" height="80" fill="#A0AEC0"/>
  <rect x="540" y="90" width="60" height="80" fill="#A0AEC0"/>
  <rect x="600" y="91" width="58" height="78" fill="#FFFFFF" stroke="#E53E3E" stroke-width="2"/>

  <g font-size="14" text-anchor="middle" fill="#FFFFFF">
    <text x="90"  y="140">1</text>
    <text x="150" y="140">2</text>
    <text x="210" y="140">3</text>
    <text x="270" y="140">4</text>
    <text x="330" y="140">5</text>
    <text x="390" y="140">6</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1A202C">
    <text x="450" y="140">7</text>
    <text x="510" y="140">8</text>
    <text x="570" y="140">9</text>
  </g>
  <text x="629" y="140" font-size="14" text-anchor="middle" fill="#C53030">10</text>

  <line x1="60" y1="194" x2="660" y2="194" stroke="#CBD5E0" stroke-width="1"/>
  <text x="360" y="224" text-anchor="middle" font-size="15" fill="#1A202C">6 : 3 : 1  =  60% : 30% : 10%  =  60 : 30 : 10（总量 100）</text>
  <text x="360" y="252" text-anchor="middle" font-size="12" fill="#718096">示意色仅用于区分角色，不构成色值推荐</text>
</svg>
