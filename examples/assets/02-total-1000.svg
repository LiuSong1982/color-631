<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#FAFBFC"/>
  <text x="60" y="36" font-size="18" font-weight="600" fill="#1A202C">图 2 · 按总量 1000 换算</text>
  <text x="360" y="70" text-anchor="middle" font-size="14" fill="#4A5568">总量 total = 1000</text>

  <rect x="60"  y="95" width="360" height="80" fill="#2D3748"/>
  <rect x="420" y="95" width="180" height="80" fill="#A0AEC0"/>
  <rect x="600" y="96" width="58" height="78" fill="#FFFFFF" stroke="#E53E3E" stroke-width="2"/>

  <text x="240" y="145" text-anchor="middle" font-size="16" fill="#FFFFFF">600 / 60%</text>
  <text x="510" y="145" text-anchor="middle" font-size="15" fill="#1A202C">300 / 30%</text>
  <text x="629" y="145" text-anchor="middle" font-size="13" fill="#C53030">100</text>
  <text x="629" y="198" text-anchor="middle" font-size="12" fill="#C53030">10%</text>

  <line x1="60" y1="210" x2="660" y2="210" stroke="#CBD5E0" stroke-width="1"/>
  <text x="360" y="232" text-anchor="middle" font-size="14" fill="#1A202C">6 : 3 : 1 不随总量变化</text>
  <text x="360" y="252" text-anchor="middle" font-size="12" fill="#718096">示意色仅用于区分角色，不构成色值推荐</text>
</svg>
